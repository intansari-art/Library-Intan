<!DOCTYPE html>
<html>
<head>
    <title>Katalog - The Rooted Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->

    <div class="container">
        <section>
            <h1>Katalog Buku Batak Toba</h1>
            <div class="search-box">
                <input type="text" placeholder="Cari judul buku atau penulis...">
                <button>Cari</button>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <div class="book-card">
                    <h3>Budaya Batak</h3>
                    <p><strong>Oleh:</strong> S. Siregar</p>
                    <p>2023 | 250 halaman</p>
                    <button>Baca Sekarang</button>
                </div>
                <div class="book-card">
                    <h3>Sejarah Toba</h3>
                    <p><strong>Oleh:</strong> R. Hutapea</p>
                    <p>2022 | 180 halaman</p>
                    <button>Baca Sekarang</button>
                </div>
                <div class="book-card">
                    <h3>Media Digital</h3>
                    <p><strong>Oleh:</strong> A. Lestari</p>
                    <p>2024 | 300 halaman</p>
                    <button>Baca Sekarang</button>
                </div>
                <div class="book-card">
                    <h3>Adat Istiadat</h3>
                    <p><strong>Oleh:</strong> T. Simanjuntak</p>
                    <p>2021 | 220 halaman</p>
                    <button>Baca Sekarang</button>
                </div>
            </div>
        </section>
    </div>

    <!-- FOOTER 2026 -->
</body>
</html>
