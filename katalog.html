<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Buku - The Rooted Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar"><!-- sama --></nav>

    <section class="katalog-section">
        <div class="container">
            <h1>📚 Katalog Buku Batak Toba</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari judul buku atau penulis...">
                <button onclick="searchBooks()">Cari</button>
            </div>
            <div class="katalog-grid" id="katalogGrid">
                <!-- Buku dimuat via JS -->
            </div>
        </div>
    </section>

    <!-- Footer & WhatsApp -->
    <script>
        const books = [
            {title: "Budaya Batak", author: "S. Siregar", year: 2023, pages: 250},
            {title: "Sejarah Toba", author: "R. Hutapea", year: 2022, pages: 180},
            {title: "Media Digital Batak", author: "A. Lestari", year: 2024, pages: 300},
            {title: "Adat Istiadat Batak", author: "T. Simanjuntak", year: 2021, pages: 220},
            {title: "Pusaka Batak Toba", author: "M. Sitorus", year: 2023, pages: 190},
            {title: "Tortor dan Gondang", author: "J. Sinaga", year: 2020, pages: 150}
        ];

        function loadBooks(filteredBooks = books) {
            const grid = document.getElementById('katalogGrid');
            grid.innerHTML = filteredBooks.map(book => `
                <div class="book-card">
                    <h3>${book.title}</h3>
                    <p><strong>Oleh:</strong> ${book.author}</p>
                    <p>${book.year} | ${book.pages} halaman</p>
                    <button class="read-btn">📖 Baca</button>
                </div>
            `).join('');
        }

        function searchBooks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)
            );
            loadBooks(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBooks();
            document.getElementById('searchInput').addEventListener('input', searchBooks);
        });
    </script>
</body>
</html>
