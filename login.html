<!DOCTYPE html>
<head>
    <title>Login - The Rooted Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Full screen login form -->
    <div class="login-container">
        <div class="login-card">
            <h2>Login Anggota</h2>
            <form id="loginForm">
                <input type="text" id="modalUsername" placeholder="Username / ID" required>
                <input type="password" id="modalPassword" placeholder="Password" required>
                <button type="submit">LOGIN SEKARANG</button>
            </form>
            <p>Belum punya akun? <a href="#">Daftar di sini</a></p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
