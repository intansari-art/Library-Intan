<!DOCTYPE html>
<html>
<head>
    <title>Login - The Rooted Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">The Rooted Library</div>
        <a href="index.html" class="login-btn">← Dashboard</a>
    </nav>

    <div class="container" style="max-width: 800px;">
        <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 80px auto;">
            
            <!-- LOGIN -->
            <div>
                <h2>Login</h2>
                <form>
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p style="text-align: center; margin-top: 15px; font-size: 14px;">admin / batak123</p>
            </div>

            <!-- DAFTAR BARU -->
            <div>
                <h2>Daftar Anggota Baru</h2>
                <form>
                    <input type="text" placeholder="Username Baru" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password Baru" required>
                    <button type="submit">Daftar</button>
                </form>
            </div>
        </section>
    </div>

    <footer>
        <div class="footer-content">The Rooted Library<br>Perpustakaan Khusus Budaya Batak Toba</div>
        <div class="footer-bottom">&copy; 2026</div>
    </footer>

    <div class="whatsapp-btn">
        <a href="https://wa.me/6281226423048" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
        </a>
    </div>

    <script>
        // LOGIN SUCCESS -> NEW TAB
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = this.querySelector('input[type="text"]').value;
            const pass = this.querySelector('input[type="password"]').value;
            
            if (user === 'admin' && pass === 'batak123') {
                window.open('dashboard-login.html', '_blank');
            } else {
                alert('Username/password salah!');
            }
        });
    </script>
</body>
</html>
