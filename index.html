<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intan Library</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #0D47A1;
}

.overlay{
    background-color: rgba(0,0,0,0.4);
    min-height:100vh;
}

nav{
    background-color: #1976D2;
    padding:15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-left {
    display: flex;
    align-items: center;
}

nav a{
    color: white;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
    display: flex;
    align-items: center;
}

nav a:hover{
    color: #FFEB3B;
    transition:0.3s;
}

/* Styling Logo */
.nav-logo {
    height: 24px;
    margin-right: 8px;
}

.container{
    padding:40px;
    max-width:900px;
    margin:auto;
}

.section{
    display:none;
}

.active{
    display:block;
}

h1,h2{
    text-align:center;
}

.link-box{
    text-align:center;
    margin-top:25px;
}

.link-box a{
    display:block;
    margin:10px;
    color: white;
    font-size:18px;
    text-decoration:none;
}

.link-box a:hover {
    color: #FFEB3B;
}

.video-box{
    text-align:center;
    margin-top:30px;
}

.video-box h3 {
    color: white;
}

iframe{
    max-width:100%;
}

/* Styling untuk Modal Form (Login & Daftar) */
.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background-color: rgba(255, 255, 255, 0.95);
    margin: 10% auto;
    padding: 25px;
    border: 1px solid #888;
    width: 80%;
    max-width: 450px;
    border-radius: 8px;
    text-align: left;
    color: #0D47A1;
    position: relative;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    right: 20px;
    top: 10px;
}

.close:hover,
.close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

/* Tab Styles */
.tab-header {
    display: flex;
    border-bottom: 2px solid #ddd;
    margin-bottom: 20px;
}

.tab-btn {
    flex: 1;
    padding: 12px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    color: #777;
    outline: none;
}

.tab-btn:hover {
    color: #1976D2;
}

.tab-btn.active {
    color: #1976D2;
    border-bottom: 3px solid #1976D2;
}

.form-content {
    display: none;
    animation: fadeEffect 0.5s;
}

.form-content.active-form {
    display: block;
}

@keyframes fadeEffect {
    from {opacity: 0;}
    to {opacity: 1;}
}

.modal-content h3 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 20px;
}

.modal-content label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 14px;
}

.modal-content input[type="text"],
.modal-content input[type="email"],
.modal-content input[type="tel"],
.modal-content input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.modal-content button {
    width: 100%;
    padding: 10px;
    background-color: #1976D2;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.modal-content button:hover {
    background-color: #1565C0;
}

/* Warna putih cerah untuk elemen spesifik di dashboard */
#dashboard h1 {
    color: white;
}

#dashboard p {
    color: white;
}

/* --- PERUBAHAN WARNA KATALOG & KEGIATAN LITERASI --- */
/* Judul menjadi biru cerah */
#katalog h2, #katalog h3,
#kegitan h2, #kegitan h3 {
    color: #00E5FF !important;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}

/* Tulisan biasa (list, paragraf) menjadi putih */
#katalog li, #katalog p,
#kegitan li, #kegitan p {
    color: white !important;
    font-size: 18px;
    line-height: 1.6;
}

/* --- FLOATING WHATSAPP BUTTON --- */
.whatsapp-float {
    position: fixed;
    width: 60px;
    height: 60px;
    bottom: 40px;
    right: 40px;
    background-color: #25d366;
    color: #FFF;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 2px 2px 3px #999;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.3s;
}

.whatsapp-float:hover {
    transform: scale(1.1);
    background-color: #20b857;
}
</style>
