<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Intan Library</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); /* Foto perpustakaan dari Unsplash */
    background-size: cover; /* Agar gambar menutupi seluruh area */
    background-position: center; /* Posisi tengah */
    background-repeat: no-repeat; /* Tidak diulang */
    background-attachment: fixed; /* Tetap saat scroll (opsional, untuk efek parallax) */
    color: #0D47A1; /* Biru gelap untuk text utama, tetap untuk kontras */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.overlay{
    background-color: rgba(0,0,0,0.4); /* Hitam transparan lebih ringan untuk kesan terbuka, tetap untuk kontras teks */
    min-height:100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background-color: rgba(255, 255, 255, 0.9); /* Putih transparan untuk form */
    padding: 30px;
    border-radius: 8px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    color: #0D47A1;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

h1 {
    margin-bottom: 20px;
    color: #1976D2; /* Biru navy untuk judul */
}

.form-section {
    margin-bottom: 30px;
}

.form-section h3 {
    margin-bottom: 15px;
    color: #1976D2;
}

.form-section label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    text-align: left;
}

.form-section input[type="text"],
.form-section input[type="email"],
.form-section input[type="tel"],
.form-section input[type="password"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.form-section button {
    width: 100%;
    padding: 10px;
    background-color: #1976D2; /* Biru navy untuk tombol */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 10px;
}

.form-section button:hover {
    background-color: #1565C0; /* Biru lebih gelap untuk hover */
}

.back-link {
    display: block;
    margin-top: 20px;
    color: #1976D2;
    text-decoration: none;
    font-weight: bold;
}

.back-link:hover {
    color: #FFEB3B;
}
</style>

<script>
// Fungsi untuk toggle antara form daftar dan login (opsional, jika diperlukan)
function toggleForm(formType) {
    const daftarForm = document.getElementById('daftarForm');
    const loginForm = document.getElementById('loginForm');
    if (formType === 'daftar') {
        daftarForm.style.display = 'block';
        loginForm.style.display = 'none';
    } else {
        daftarForm.style.display = 'none';
        loginForm.style.display = 'block';
    }
}
</script>

</head>

<body>
<div class="overlay">
<div class="container">
<h1>Daftar Anggota Perpustakaan</h1>

<!-- Form Daftar Anggota -->
<div class="form-section" id="daftarForm">
<h3>Daftar Anggota</h3>
<form action="#" method="post"> <!-- Ganti action dengan endpoint backend jika diperlukan -->
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" required>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="noHp">No HP:</label>
    <input type="tel" id="noHp" name="noHp" required>

    <button type="submit">Daftar</button>
</form>
</div>

<!-- Form Login untuk Anggota yang Sudah Terdaftar -->
<div class="form-section" id="loginForm" style="display: none;"> <!-- Awalnya tersembunyi, bisa diaktifkan jika diperlukan -->
<h3>Login Anggota</h3>
<form action="#" method="post"> <!-- Ganti action dengan endpoint backend jika diperlukan -->
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Login</button>
</form>
</div>

<!-- Tombol untuk Toggle (opsional) -->
<button onclick="toggleForm('daftar')">Tampilkan Form Daftar</button>
<button onclick="toggleForm('login')">Tampilkan Form Login</button>

<a href="index.html" class="back-link">Kembali ke Homepage</a>
</div>
</div>

</body>
</html>
