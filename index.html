<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intan Library</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background-image: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #0D47A1;
}

.overlay{
    background-color: rgba(0,0,0,0.4);
    min-height:100vh;
}

nav{
    background-color: #1976D2;
    padding:15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-left {
    display: flex;
    align-items: center;
}

nav a{
    color: white;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color: #FFEB3B;
    transition:0.3s;
}

/* Logo Styling */
.nav-logo {
    height: 30px;
    margin-right: 10px;
}

.container{
    padding:40px;
    max-width:900px;
    margin:auto;
}

.section{
    display:none;
}

.active{
    display:block;
}

h1,h2{
    text-align:center;
}

.link-box{
    text-align:center;
    margin-top:25px;
}

.link-box a{
    display:block;
    margin:10px;
    color: white;
    font-size:18px;
    text-decoration:none;
}

.link-box a:hover {
    color: #FFEB3B;
}

.video-box{
    text-align:center;
    margin-top:30px;
}

.video-box h3 {
    color: white;
}

iframe{
    max-width:100%;
}

/* Styling untuk Modal */
.modal {
    display: none; 
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.6);
}

.modal-content {
    background-color: rgba(255, 255, 255, 0.95);
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 90%;
    max-width: 450px;
    border-radius: 10px;
    text-align: left;
    color: #0D47A1;
    position: relative;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 10px;
    right: 20px;
}

.close:hover,
.close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

/* Tab Buttons */
.tab-container {
    display: flex;
    margin-bottom: 20px;
    border-bottom: 2px solid #ddd;
}

.tab-btn {
    flex: 1;
    padding: 12px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    color: #777;
    transition: 0.3s;
}

.tab-btn:hover {
    color: #1976D2;
}

.tab-btn.active {
    color: #1976D2;
    border-bottom: 3px solid #1976D2;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #1976D2;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
}

.submit-btn:hover {
    background-color: #1565C0;
}

/* Styling Katalog & Kegiatan */
#katalog h2, #kegiatan h2 {
    color: #00E5FF; /* Biru Cerah */
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
}

#katalog li, #katalog p,
#kegiatan li, #kegiatan p {
    color: white;
    font-size: 18px;
    line-height: 1.6;
}

#dashboard h1 {
    color: white;
}

#dashboard p {
    color: white;
}

/* Floating WhatsApp Button */
.whatsapp-float {
    position: fixed;
    width: 60px;
    height: 60px;
    bottom: 40px;
    right: 40px;
    background-color: #25d366;
    color: white;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 2px 2px 3px #999;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.3s;
}

.whatsapp-float:hover {
    background-color: #20b857;
    transform: scale(1.1);
}

.whatsapp-icon {
    width: 35px;
    height: 35px;
    fill: white;
}
</style>

<script>
function showMenu(menu){
    document.querySelectorAll('.section').forEach(sec=>{
        sec.classList.remove('active');
    });
    document.getElementById(menu).classList.add('active');
}

function showLoginForm(){
    document.getElementById('authModal').style.display = 'block';
    // Default ke tab Login saat dibuka
    openTab('loginTab');
}

function closeModal(){
    document.getElementById('authModal').style.display = 'none';
}

// Tutup modal jika klik di luar modal
window.onclick = function(event) {
    const modal = document.getElementById('authModal');
    if (event.target == modal) {
        modal.style.display = 'none';
    }
}

// Fungsi untuk switch tab di dalam modal
function openTab(tabName) {
    var i, tabcontent, tablinks;
    
    // Sembunyikan semua form
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }
    
    // Hapus class active dari semua tombol
    tablinks = document.getElementsByClassName("tab-btn");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    
    // Tampilkan form yang dipilih dan aktifkan tombol
    document.getElementById(tabName).style.display = "block";
    
    // Cari tombol yang sesuai dengan tabName (hacky way untuk demo, biasanya ID dihubungkan langsung)
    // Kita cari tombol berdasarkan onclick attribute untuk simplicity di HTML ini
    var buttons = document.querySelectorAll('.tab-btn');
    buttons.forEach(btn => {
        if(btn.getAttribute('onclick').includes(tabName)) {
            btn.className += " active";
        }
    });
}
</script>
</head>

<body>
<div class="overlay">

<nav>
<div class="nav-left">
    <!-- Logo Perpustakaan -->
    <img src="https://cdn-icons-png.flaticon.com/512/3241/3241393.png" alt="Logo" class="nav-logo">
    <a href="javascript:void(0)" onclick="showMenu('dashboard')">Dashboard</a>
    <a href="javascript:void(0)" onclick="showMenu('katalog')">Katalog</a>
    <a href="javascript:void(0)" onclick="showMenu('kegiatan')">Kegiatan Literasi</a>
</div>
<a href="javascript:void(0)" onclick="showLoginForm()">Login</a>
</nav>

<!-- Modal untuk Login dan Daftar -->
<div id="authModal" class="modal">
<div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    
    <div class="tab-container">
        <button class="tab-btn active" onclick="openTab('loginTab')">Login</button>
        <button class="tab-btn" onclick="openTab('registerTab')">Daftar</button>
    </div>

    <!-- Form Login -->
    <div id="loginTab" class="tab-content">
        <h3 style="text-align:center; margin-top:0;">Masuk Akun</h3>
        <form action="#" method="post">
            <div class="form-group">
                <label for="loginUsername">Username:</label>
                <input type="text" id="loginUsername" name="username" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>

    <!-- Form Daftar -->
    <div id="registerTab" class="tab-content">
        <h3 style="text-align:center; margin-top:0;">Daftar Anggota Baru</h3>
        <form action="#" method="post">
            <!-- Username dan Password dipindah ke atas -->
            <div class="form-group">
                <label for="regUsername">Username:</label>
                <input type="text" id="regUsername" name="username" required>
            </div>
            <div class="form-group">
                <label for="regPassword">Password:</label>
                <input type="password" id="regPassword" name="password" required>
            </div>
