<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event - The Rooted Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->

    <section class="events">
        <div class="container">
            <h1>Event & Kegiatan</h1>
            <div class="events-grid">
                <div class="event-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7f/Batak_Toba_-_Horja_Bius.svg" alt="Horja Bius">
                    <div class="event-content">
                        <h3>Horja Bius 2025</h3>
                        <p>Tanggal: 15 Maret 2025</p>
                        <p>Upacara adat Batak Toba yang sakral</p>
                        <button>Daftar</button>
                    </div>
                </div>
                <div class="event-card">
                    <img src="https://via.placeholder.com/400x250?text=Event+Budaya" alt="Event">
                    <div class="event-content">
                        <h3>Seminar Budaya Batak</h3>
                        <p>Tanggal: 20 April 2025</p>
                        <p>Diskusi tentang warisan Batak Toba</p>
                        <button>Daftar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
