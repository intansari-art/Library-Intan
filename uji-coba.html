<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Uji Coba</title>

<style>
body{
font-family: Arial;
background:#f5f5f5;
padding:20px;
}

h2{
text-align:center;
}

/* BOX BIRU */
.box{
background:#2196F3;
color:white;
padding:20px;
border-radius:10px;
max-height:300px;
overflow:auto;
}

/* FORM */
input, select, button{
padding:10px;
margin:5px;
}

/* TABLE */
table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

td,th{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

button{
cursor:pointer;
}
</style>
</head>

<body>

<h2>Ruang Uji Coba</h2>

<h3>1. Belajar PHP</h3>

<div class="box" id="hari"></div>

<h3>2. Menu Berhitung</h3>

<input id="a" placeholder="Angka 1">
<select id="op">
<option value="+">Tambah (+)</option>
<option value="-">Kurang (-)</option>
<option value="*">Kali (*)</option>
<option value="/">Bagi (/)</option>
</select>
<input id="b" placeholder="Angka 2">

<button onclick="hitung()">Hitung</button>

<h3>3. Login</h3>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="hasilLogin"></p>

<h3>4. Sistem Database (CRUD)</h3>

<input id="judul" placeholder="Judul Buku">
<input id="penulis" placeholder="Penulis">
<input id="tahun" placeholder="Tahun">

<button onclick="tambah()">Tambah</button>

<table>
<tr>
<th>ID</th>
<th>Judul</th>
<th>Penulis</th>
<th>Tahun</th>
<th>Aksi</th>
</tr>

<tbody id="data"></tbody>

</table>

<script>

/* 1. AUTO 1-1000 */
for(let i=1;i<=1000;i++){
document.getElementById("hari").innerHTML +=
"Ini adalah hari ke-"+i+" aku belajar PHP<br>";
}

/* 2. KALKULATOR */
function hitung(){
let a=parseFloat(document.getElementById("a").value);
let b=parseFloat(document.getElementById("b").value);
let op=document.getElementById("op").value;

if(isNaN(a)||isNaN(b)){
alert("Isi angka dulu");
return;
}

let hasil;

if(op=="+") hasil=a+b;
if(op=="-") hasil=a-b;
if(op=="*") hasil=a*b;
if(op=="/") hasil=a/b;

alert("Hasil: "+hasil);
}

/* 3. LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==""||p==""){
hasilLogin.innerText="Input tidak lengkap";
}else if(u=="admin" && p=="123"){
hasilLogin.innerText="Login sukses";
}else{
hasilLogin.innerText="Login gagal";
}
}

/* 4. CRUD */
let no=1;

function tambah(){
let j=document.getElementById("judul").value;
let p=document.getElementById("penulis").value;
let t=document.getElementById("tahun").value;

let row=`
<tr>
<td>${no++}</td>
<td contenteditable="true">${j}</td>
<td contenteditable="true">${p}</td>
<td contenteditable="true">${t}</td>
<td>
<button onclick="hapus(this)">Hapus</button>
</td>
</tr>
`;

document.getElementById("data").innerHTML += row;
}

function hapus(btn){
btn.parentElement.parentElement.remove();
}

</script>

</body>
</html>
