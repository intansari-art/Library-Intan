<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Coba - The Rooted Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR SAMA -->

    <div class="container">
        <section>
            <h1>🧪 Ruang Uji Coba</h1>
            
            <!-- 1. BELAJAR PHP 1000 HARI -->
            <div class="uji-section">
                <h2>1. Belajar PHP 1000 Hari</h2>
                <div class="php-box" id="phpDays">
                    Loading 1000 hari belajar PHP...
                </div>
            </div>

            <!-- 2. KALKULATOR -->
            <div class="uji-section">
                <h2>2. Kalkulator Operasi Bilangan</h2>
                <form class="kalkulator-form">
                    <input type="number" name="angka1" placeholder="Masukkan Angka 1" required>
                    <select name="operasi">
                        <option value="+">Tambah (+)</option>
                        <option value="-">Kurang (-)</option>
                        <option value="*">Kali (*)</option>
                        <option value="/">Bagi (/)</option>
                    </select>
                    <input type="number" name="angka2" placeholder="Masukkan Angka 2" required>
                    <button type="submit">Hitung</button>
                </form>
            </div>

            <!-- 3. LOGIN -->
            <div class="uji-section">
                <h2>3. Sistem Login</h2>
                <form class="login-form">
                    <input type="text" name="username" placeholder="Username">
                    <input type="password" name="password" placeholder="Password">
                    <button type="submit">Login</button>
                    <p style="font-size: 14px; color: #666;">Demo: admin / batak123</p>
                </form>
            </div>

            <!-- 4. CRUD -->
            <div class="uji-section">
                <h2>4. Sistem Manajemen Database (CRUD)</h2>
                <form class="crud-form">
                    <input type="text" name="judul" placeholder="Judul Buku">
                    <input type="text" name="penulis" placeholder="Penulis">
                    <input type="number" name="tahun" placeholder="Tahun">
                    <button type="submit">Tambah</button>
                </form>
                <table class="crud-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Judul Buku</th>
                            <th>Penulis</th>
                            <th>Tahun</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>7</td>
                            <td>E</td>
                            <td>Siregar</td>
                            <td>2023</td>
                            <td><button>Simpan</button><button>Hapus</button></td>
                        </tr>
                        <tr>
                            <td>5</td>
                            <td>Lask</td>
                            <td>Hutapea</td>
                            <td>2022</td>
                            <td><button>Simpan</button><button>Hapus</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- FOOTER & WA -->

    <script>
        // 1000 HARI PHP EXACT FORMAT
        const phpBox = document.getElementById('phpDays');
        let day = 1;
        const interval = setInterval(() => {
            if (day <= 1000) {
                phpBox.innerHTML += `Ini adalah hari ke-${day} belajar PHP<br>`;
                day++;
                phpBox.scrollTop = phpBox.scrollHeight;
            } else {
                clearInterval(interval);
            }
        }, 3);
    </script>
</body>
</html>
