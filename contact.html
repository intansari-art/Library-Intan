/* CSS sama */
.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    max-width: 1100px;
    margin: 60px auto;
    padding: 0 20px;
}

.contact-form-section, .contact-info {
    background: rgba(255,255,255,0.95);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
}

.contact-form-section h2, .contact-info h2 {
    color: #1976D2;
    margin-bottom: 25px;
    text-align: center;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.contact-form input, .contact-form textarea {
    padding: 18px;
    border: 2px solid #E3F2FD;
    border-radius: 15px;
    font-size: 16px;
    transition: all 0.3s;
}
